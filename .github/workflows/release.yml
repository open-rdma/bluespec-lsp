name: Release BSV LSP Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v0.1.0

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            server_name: bsv-language-server
            vsix_suffix: linux-x64
            rust_toolchain_target: x86_64-unknown-linux-gnu

          # Linux ARM64 (native ARM runner)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            server_name: bsv-language-server
            vsix_suffix: linux-arm64
            rust_toolchain_target: aarch64-unknown-linux-gnu

          # macOS Intel x86_64 (cross-compiled from ARM runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            server_name: bsv-language-server
            vsix_suffix: darwin-x64
            rust_toolchain_target: x86_64-apple-darwin

          # macOS Apple Silicon ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            server_name: bsv-language-server
            vsix_suffix: darwin-arm64
            rust_toolchain_target: aarch64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            server_name: bsv-language-server.exe
            vsix_suffix: win32-x64
            rust_toolchain_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'bsv-language-server/package-lock.json'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.rust_toolchain_target }}

    - name: Install tree-sitter-cli
      run: cargo install tree-sitter-cli --version 0.24.7

    - name: Install dependencies
      run: |
        cd bsv-language-server
        npm install

    - name: Compile TypeScript client
      run: |
        cd bsv-language-server
        npm run compile

    - name: Build Rust server
      shell: bash
      run: |
        cd bsv-language-server
        cargo build --release --target ${{ matrix.target }}
        test -f "target/${{ matrix.target }}/release/${{ matrix.server_name }}"

    - name: Prepare server directory for VSIX
      shell: bash
      run: |
        cd bsv-language-server
        mkdir -p server
        cp "target/${{ matrix.target }}/release/${{ matrix.server_name }}" server/
        ls -la server/

    - name: Install vsce
      shell: bash
      run: npm install -g @vscode/vsce

    - name: Package VSIX
      shell: bash
      run: |
        cd bsv-language-server
        npm install
        vsce package --out "bsv-language-server-${{ matrix.vsix_suffix }}-${{ github.ref_name }}.vsix"
        ls -la *.vsix

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix-${{ matrix.vsix_suffix }}
        path: bsv-language-server/*.vsix

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all VSIX artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: vsix-*
        merge-multiple: true

    - name: List downloaded VSIX files
      run: ls -la *.vsix

    - name: Get version from tag
      id: get_version
      run: |
        version="${GITHUB_REF_NAME#v}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Tag version: $version"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "BSV Language Server v${{ steps.get_version.outputs.version }}"
        tag_name: ${{ github.ref_name }}
        body: |
          ## BSV Language Server v${{ steps.get_version.outputs.version }}

          ### Features
          - Symbol navigation (go-to-definition, document symbols)
          - Constant expansion with hover documentation
          - Syntax highlighting and error recovery
          - Linux x86_64, Linux ARM64, macOS Intel, macOS Apple Silicon, and Windows x86_64 native support

          ### Installation
          1. Download the `.vsix` file for your platform
          2. Open VS Code
          3. Go to Extensions view (Ctrl+Shift+X)
          4. Click "..." menu and select "Install from VSIX..."
          5. Select the downloaded file

          ### Platform Notes
          - `bsv-language-server-linux-x64-*.vsix` → Linux x86_64
          - `bsv-language-server-linux-arm64-*.vsix` → Linux ARM64
          - `bsv-language-server-darwin-x64-*.vsix` → macOS Intel
          - `bsv-language-server-darwin-arm64-*.vsix` → macOS Apple Silicon
          - `bsv-language-server-win32-x64-*.vsix` → Windows x86_64
        draft: false
        prerelease: false
        files: |
          *.vsix