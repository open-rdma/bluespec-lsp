[package]
name = "bsv-language-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20.0"
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
tree-sitter = "0.20.10"
regex = "1.10"
dashmap = "5.5"
tokio = { version = "1.50", features = ["full"] }
async-trait = "0.1"
lsp-types = "0.94"

[build-dependencies]
cc = "1.0"
